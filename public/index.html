<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BYTE BACK · 내 자료실</title>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#101a28"><link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>body{font-family:system-ui,sans-serif;background:#101a28;color:#ecf4ff;max-width:760px;margin:auto;padding:32px 20px;line-height:1.5}input,button{padding:11px;margin:4px;border-radius:8px;border:1px solid #51667c;background:#18283b;color:inherit;font:inherit}button{cursor:pointer}li{margin:10px 0;padding:14px;border:1px solid #51667c;border-radius:10px;list-style:none}.error{color:#ff9aa9}.badge{display:inline-block;padding:4px 10px;border-radius:999px;border:1px solid #51667c;font-size:14px}.ok{border-color:#2f8f83;color:#8fe3d5}.wait{border-color:#b08a3a;color:#f2d38a}.note{font-size:14px;color:#a9bcd0}</style></head>
<body>
<h1>내 자료실</h1>
<p class="note">앱으로 설치해도 기기 확인이 끝난 것은 아닙니다. 서버가 이 기기를 승인한 뒤에만 자료가 열립니다.</p>
<p>기기 상태: <span id="deviceBadge" class="badge wait">확인 전</span> <span id="offlineBadge" class="badge wait" hidden>오프라인</span></p>

<section id="login"><h2>로그인</h2><input id="email" type="email" placeholder="이메일" autocomplete="username"><input id="password" type="password" placeholder="비밀번호" autocomplete="current-password"><button id="loginBtn">로그인</button><p id="error" class="error"></p></section>

<section id="device" hidden><h2>기기 승인</h2>
<p>이 브라우저에서 만든 기기 키(내보낼 수 없는 키, 저장하지 않음)로 승인을 요청합니다. 승인은 서버가 비밀번호 재확인과 기기 키 서명을 모두 검증해야 끝납니다. 새로고침하면 키가 사라지므로 다시 승인해야 합니다.</p>
<p>기기 ID: <code id="deviceId">-</code></p>
<button id="requestBtn">승인 요청</button>
<div id="approveBox" hidden><input id="approvePassword" type="password" placeholder="비밀번호 다시 입력" autocomplete="current-password"><button id="approveBtn">서버에 승인 확인 요청</button></div>
<p id="deviceMsg" class="note"></p></section>

<section id="app" hidden><h2>메모</h2><button id="logout">로그아웃</button>
<form id="add"><input id="title" placeholder="제목" required><input id="content" placeholder="내용" required><button>메모 추가</button></form>
<form id="open"><input id="openId" placeholder="메모 ID" inputmode="numeric" required><button>ID로 열기</button></form>
<p id="appMsg" class="error"></p><ul id="notes"></ul></section>

<script type="module">
const $ = id => document.getElementById(id);
const enc = new TextEncoder();
// Access token and device key live only in this page's memory. Nothing is written to browser storage.
let token = '', keys = null, deviceId = '', approved = false;
const shown = new Map();
const hex = bytes => [...new Uint8Array(bytes)].map(b => b.toString(16).padStart(2, '0')).join('');
const b64url = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const sha256 = async text => hex(await crypto.subtle.digest('SHA-256', enc.encode(text)));
const sign = async text => b64url(await crypto.subtle.sign({ name: 'ECDSA', hash: 'SHA-256' }, keys.privateKey, enc.encode(text)));

function setBadge(text, ok) { $('deviceBadge').textContent = text; $('deviceBadge').className = 'badge ' + (ok ? 'ok' : 'wait'); }
function view(state) {
  $('login').hidden = state !== 'login'; $('device').hidden = state !== 'device'; $('app').hidden = state !== 'app';
  if (state !== 'app') $('notes').replaceChildren();
}

async function api(path, options = {}) {
  return fetch(path, { ...options, headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json', ...(options.headers ?? {}) } });
}

// Every protected request is signed over method, path(+query), body hash, time and a one-time nonce.
async function signed(method, path, body) {
  if (!approved) throw new Error('device not approved');
  const bodyText = body ? JSON.stringify(body) : '';
  const timestamp = new Date().toISOString();
  const nonce = hex(crypto.getRandomValues(new Uint8Array(16)));
  const canonical = ['aleph-device-v1', method, path, await sha256(bodyText), timestamp, nonce, deviceId].join('\n');
  return api(path, { method, body: bodyText || undefined, headers: {
    'X-Device-Id': deviceId, 'X-Device-Timestamp': timestamp, 'X-Device-Nonce': nonce, 'X-Device-Signature': await sign(canonical) } });
}

async function prepareDevice() {
  keys = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign', 'verify']);
  approved = false; deviceId = ''; $('deviceId').textContent = '-'; $('approveBox').hidden = true;
  setBadge('미승인', false); $('deviceMsg').textContent = ''; view('device');
}

$('requestBtn').onclick = async () => {
  const { kty, crv, x, y } = await crypto.subtle.exportKey('jwk', keys.publicKey);
  const r = await api('/api/device', { method: 'POST', body: JSON.stringify({ action: 'request', publicKey: { kty, crv, x, y } }) });
  const d = await r.json();
  if (!r.ok) { $('deviceMsg').textContent = d.error; return; }
  deviceId = d.deviceId; $('deviceId').textContent = deviceId;
  if (d.status === 'approved') return confirmApproval();
  $('approveBox').hidden = false; $('approveBox').dataset.challenge = d.challenge;
  setBadge('승인 대기', false); $('deviceMsg').textContent = '비밀번호를 다시 입력하면 서버가 계정과 기기 키를 확인합니다.';
};

$('approveBtn').onclick = async () => {
  const signature = await sign(`aleph-device-approve-v1\n${deviceId}\n${$('approveBox').dataset.challenge}`);
  const r = await api('/api/device', { method: 'POST', body: JSON.stringify({ action: 'approve', deviceId, signature, password: $('approvePassword').value }) });
  $('approvePassword').value = '';
  const d = await r.json();
  if (!r.ok) { $('deviceMsg').textContent = d.error; return; }
  confirmApproval();
};

// The vault opens only when the server's own record says this device is approved.
async function confirmApproval() {
  const r = await api('/api/device?deviceId=' + encodeURIComponent(deviceId));
  const d = await r.json();
  if (!r.ok || d.status !== 'approved' || d.deviceId !== deviceId) { setBadge('미승인', false); $('deviceMsg').textContent = '서버가 아직 이 기기를 승인하지 않았습니다.'; return; }
  approved = true; setBadge('서버 승인됨 · ' + deviceId, true); view('app'); render();
}

function render() {
  $('notes').replaceChildren(...[...shown.values()].map(n => {
    const li = document.createElement('li'); const text = document.createElement('span');
    text.textContent = `#${n.id} ${n.title}: ${n.content}`;
    const edit = document.createElement('button'); edit.textContent = '수정';
    edit.onclick = async () => { const title = prompt('제목', n.title), content = prompt('내용', n.content); if (title && content) await save(await signed('PATCH', '/api/notes', { id: n.id, title, content })); };
    const del = document.createElement('button'); del.textContent = '삭제';
    del.onclick = async () => { const r = await signed('DELETE', '/api/notes', { id: n.id }); if (r.ok) { shown.delete(String(n.id)); render(); } else report(r); };
    li.append(text, edit, del); return li;
  }));
}
async function report(r) { const d = await r.json().catch(() => ({})); $('appMsg').textContent = d.error ? `${d.error}${d.reason ? ' (' + d.reason + ')' : ''}` : `HTTP ${r.status}`; if (d.reason === 'device_not_registered' || d.reason === 'device_not_approved') prepareDevice(); }
async function save(r) { if (!r.ok) return report(r); $('appMsg').textContent = ''; const d = await r.json(); for (const n of d.notes) shown.set(String(n.id), n); render(); }

$('add').onsubmit = async e => { e.preventDefault(); await save(await signed('POST', '/api/notes', { title: $('title').value, content: $('content').value })); e.target.reset(); };
$('open').onsubmit = async e => { e.preventDefault(); await save(await signed('GET', '/api/notes?id=' + encodeURIComponent($('openId').value.trim()))); };

$('loginBtn').onclick = async () => {
  const r = await fetch('/api/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: $('email').value, password: $('password').value }) });
  $('password').value = '';
  const d = await r.json();
  if (!r.ok) { $('error').textContent = d.error; return; }
  token = d.access_token; $('error').textContent = '';
  await prepareDevice();
};
$('logout').onclick = () => { token = ''; keys = null; approved = false; deviceId = ''; shown.clear(); setBadge('확인 전', false); view('login'); };

const online = () => { $('offlineBadge').hidden = navigator.onLine; };
addEventListener('online', online); addEventListener('offline', online); online();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
view('login');
</script></body></html>
