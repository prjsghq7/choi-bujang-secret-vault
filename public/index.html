<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BYTE BACK · 로그인 자료실</title><style>body{font-family:system-ui,sans-serif;background:#101a28;color:#ecf4ff;max-width:760px;margin:auto;padding:32px 20px}input,button{padding:11px;margin:4px;border-radius:8px;border:1px solid #51667c;background:#18283b;color:inherit}button{cursor:pointer}li{margin:10px 0;padding:14px;border:1px solid #51667c;border-radius:10px;list-style:none}.error{color:#ff9aa9}</style></head>
<body><h1>로그인 자료실</h1><p>4단계: 로그인한 사용자 본인의 가상 메모만 관리합니다.</p><section id="login"><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="loginBtn">로그인</button><p id="error" class="error"></p></section><section id="app" hidden><button id="logout">로그아웃</button><form id="add"><input id="title" placeholder="제목" required><input id="content" placeholder="내용" required><button>메모 추가</button></form><ul id="notes"></ul></section>
<script type="module">const $=id=>document.getElementById(id),key='vault_access_token';let token=localStorage.getItem(key);const show=ok=>{$('login').hidden=ok;$('app').hidden=!ok};const call=async(method,body)=>fetch('/api/notes',{method,headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});async function load(){const r=await call('GET');if(!r.ok){localStorage.removeItem(key);token='';show(false);return}const d=await r.json();$('notes').replaceChildren(...d.notes.map(n=>{const x=document.createElement('li');const text=document.createElement('span');text.textContent=`${n.title}: ${n.content}`;const edit=document.createElement('button');edit.textContent='수정';edit.onclick=async()=>{const title=prompt('제목',n.title),content=prompt('내용',n.content);if(title&&content){await call('PATCH',{id:n.id,title,content});load()}};const del=document.createElement('button');del.textContent='삭제';del.onclick=async()=>{await call('DELETE',{id:n.id});load()};x.append(text,edit,del);return x}))}$('loginBtn').onclick=async()=>{const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const d=await r.json();if(!r.ok){$('error').textContent=d.error;return}token=d.access_token;localStorage.setItem(key,token);show(true);load()};$('logout').onclick=()=>{localStorage.removeItem(key);token='';show(false)};$('add').onsubmit=async e=>{e.preventDefault();await call('POST',{title:$('title').value,content:$('content').value});e.target.reset();load()};show(Boolean(token));if(token)load()</script></body></html>
