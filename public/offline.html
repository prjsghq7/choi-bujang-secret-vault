<body><h1>오프라인 상태입니다</h1><p>네트워크에 연결되지 않아 자료실을 열 수 없습니다. 메모는 기기에 저장하지 않으므로 오프라인에서는 보이지 않습니다.</p><p>연결이 돌아오면 다시 로그인하고, 서버가 이 기기를 승인한 뒤에만 자료가 열립니다.</p></body></html>
